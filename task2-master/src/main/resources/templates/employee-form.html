<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${employee.id == null} ? 'Добавление сотрудника' : 'Редактирование сотрудника'">Сотрудник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 640px;">
    <h1 class="h2 text-dark mb-4"
        th:text="${employee.id == null} ? 'Добавление сотрудника' : 'Редактирование сотрудника'">Сотрудник</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/employees/add}" th:object="${employee}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="fullName" class="form-label">ФИО</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон</label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control"
                           placeholder="+79991234567"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label for="position" class="form-label">Должность</label>
                    <input type="text" id="position" th:field="*{position}" class="form-control"
                           th:classappend="${#fields.hasErrors('position')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{position}"></div>
                </div>

                <div class="mb-3">
                    <label for="salary" class="form-label">Зарплата</label>
                    <input type="number" step="0.01" min="0.01" id="salary" th:field="*{salary}" class="form-control"
                           th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{salary}"></div>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" id="active" th:field="*{active}" class="form-check-input">
                    <label for="active" class="form-check-label">Активен</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a th:href="@{/employees}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
