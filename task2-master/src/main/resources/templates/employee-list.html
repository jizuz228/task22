<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список сотрудников</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-dark">Список сотрудников</h1>
        <a th:href="@{/employees/add}" class="btn btn-primary">Добавить сотрудника</a>
    </div>

    <!-- Вывод ошибки, если она передана через модель -->
    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <!-- Форма поиска и фильтрации -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/employees}" method="get" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="name" class="form-label">Поиск по ФИО</label>
                    <input type="text" id="name" name="name" th:value="${currentName}"
                           class="form-control" placeholder="Введите имя или фамилию...">
                </div>

                <div class="col-md-4">
                    <label for="active" class="form-label">Статус активности</label>
                    <select id="active" name="active" class="form-select">
                        <option value="" th:selected="${currentActive == null}">Все статусы</option>
                        <option value="true" th:selected="${currentActive != null and currentActive}">Активные</option>
                        <option value="false" th:selected="${currentActive != null and !currentActive}">Неактивные</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-success w-100">Применить</button>
                    <a th:href="@{/employees}" class="btn btn-secondary w-100">Сбросить</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Таблица сотрудников -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-3">ID</th>
                        <th scope="col">ФИО</th>
                        <th scope="col">Email</th>
                        <th scope="col">Телефон</th>
                        <th scope="col">Должность</th>
                        <th scope="col">Зарплата</th>
                        <th scope="col">Статус</th>
                        <th scope="col" class="text-end pe-3">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Безопасная проверка на пустой список -->
                    <tr th:if="${employees == null or #lists.isEmpty(employees)}">
                        <td colspan="8" class="text-center text-muted py-4">Сотрудники не найдены</td>
                    </tr>

                    <!-- Цикл отрисовки (будет работать только если список не пуст) -->
                    <tr th:each="emp : ${employees}">
                        <td class="ps-3" th:text="${emp.id}">1</td>
                        <td class="fw-bold" th:text="${emp.fullName}">Имя</td>
                        <td th:text="${emp.email}">Email</td>
                        <td th:text="${emp.phone}">Телефон</td>
                        <td th:text="${emp.position}">Должность</td>
                        <td th:text="${#numbers.formatDecimal(emp.salary, 1, 'WHITESPACE', 2, 'POINT')}">Зарплата</td>
                        <td>
                            <span th:if="${emp.active}" class="badge bg-success">Активен</span>
                            <span th:unless="${emp.active}" class="badge bg-danger">Неактивен</span>
                        </td>
                        <td class="text-end pe-3">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                                   class="btn btn-sm btn-outline-warning">Изменить</a>

                                <form th:action="@{/employees/delete/{id}(id=${emp.id})}"
                                      method="post"
                                      onsubmit="return confirm('Вы уверены, что хотите удалить этого сотрудника?');"
                                      class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
